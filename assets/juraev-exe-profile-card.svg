      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="23" fill="none" stroke="#334155"/>
  <circle cx="88" cy="84" r="8" fill="#38bdf8">
    <animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="116" y="92" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">online / building in public</text>
  <text x="80" y="164" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="68" font-weight="700">JA <tspan fill="#38bdf8">/</tspan> juraev.exe</text>
  <text x="84" y="215" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30">Cybersecurity  •  Software Development  •  Automation</text>
  <rect x="80" y="250" width="1040" height="2" fill="url(#line)">
