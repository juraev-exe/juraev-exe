<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">JA / juraev.exe</title>
  <desc id="desc">Cybersecurity, software development, and automation.</desc>
  <defs>
